<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>تواصل معنا - مدونة منصة أدوات الطاقة الشمسية والتقنية</title>
    
    <link rel="icon" type="image/png" href="favicon-96x96.png?v=3" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
    <link rel="shortcut icon" href="favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding: 16px;
            max-width: 700px;
            margin: 0 auto;
            padding-bottom: 50px;
            line-height: 1.7;
        }

        /* الهيدر وزر العودة */
        .header-nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .back-btn:hover { background-color: #475569; }

        /* الكارت الرئيسي */
        .contact-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            text-align: center;
        }

        .main-title-box {
            background-color: #0f172a;
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .main-title-box h1 {
            font-size: 20px;
            color: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
        }

        .contact-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 24px;
            line-height: 1.8;
        }

        /* أزرار التواصل المباشرة */
        .direct-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-direct {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-whatsapp-direct { background-color: #10b981; }
        .btn-whatsapp-direct:hover { background-color: #059669; }

        .btn-facebook-direct { background-color: #2563eb; }
        .btn-facebook-direct:hover { background-color: #1d4ed8; }

        .btn-email-direct {
            background-color: #0284c7;
            grid-column: span 2;
            padding: 14px;
            font-size: 15px;
        }
        .btn-email-direct:hover { background-color: #0369a1; }

        /* قسم النموذج المباشر */
        .form-section-title {
            color: #34d399;
            font-size: 16px;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 16px;
            text-align: right;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: right;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: #38bdf8;
        }

        textarea.input-field {
            resize: vertical;
            min-height: 120px;
        }

        .btn-send {
            width: 100%;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn-send:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>

    <div class="contact-card">
        <div class="main-title-box">
            <h1>💬 تواصل معنا</h1>
        </div>

        <p class="contact-desc">
            يسعدنا التواصل معك واستقبال استفساراتك واقتراحاتك لتطوير <strong>مدونة منصة أدوات الطاقة الشمسية والتقنية</strong>:
        </p>

        <!-- أزرار التواصل المباشرة الملونة -->
        <div class="direct-buttons">
            <a href="https://wa.me/967775510660" target="_blank" class="btn-direct btn-whatsapp-direct">
                💬 واتساب مباشر
            </a>
            <a href="https://www.facebook.com/profile.php?id=61595054055544" target="_blank" class="btn-direct btn-facebook-direct">
                🌐 فيسبوك
            </a>
            <a href="mailto:mazen.alawdhali@gmail.com" class="btn-direct btn-email-direct">
                ✉️ البريد الإلكتروني
            </a>
        </div>

        <!-- نموذج إرسال ملاحظة مباشرة -->
        <div class="form-section-title">إرسال مقترح أو ملاحظة مباشرة:</div>

        <form action="mailto:mazen.alawdhali@gmail.com" method="post" enctype="text/plain">
            <div class="input-group">
                <input type="text" name="الاسم" class="input-field" placeholder="اسمك (اختياري)">
            </div>
            <div class="input-group">
                <textarea name="المقترح_أو_الشكوى" class="input-field" placeholder="اكتب مقترحك أو الشكوى هنا . . ."></textarea>
            </div>
            <button type="submit" class="btn-send">إرسال عبر البريد الإلكتروني</button>
        </form>
    </div>

</body>
</html>
