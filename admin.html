<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="إدارة المدونة">
    <title>لوحة إدارة المدونة | SolarToolsPro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding: 16px;
            max-width: 650px;
            margin: 0 auto;
        }
        h1, h2 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        textarea { height: 200px; resize: vertical; line-height: 1.6; }
        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green { background-color: #10b981; color: #fff; width: 100%; font-size: 16px; padding: 12px; }
        .btn-blue { background-color: #0284c7; color: #fff; width: 100%; margin-bottom: 10px; }
        .btn-purple { background-color: #6366f1; color: #fff; width: 100%; margin-bottom: 8px; }
        .btn-red { background-color: #ef4444; color: #fff; }
        .btn-edit { background-color: #f59e0b; color: #fff; }
        button:disabled { background-color: #475569; }

        /* شريط أزرار تنسيق النص */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background-color: #1e293b;
            padding: 8px;
            border: 1px solid #334155;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }
        .tool-btn {
            background-color: #334155;
            color: #e2e8f0;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 4px;
        }
        .tool-btn:hover { background-color: #475569; }
        .styled-textarea {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /* معرض معاينة الصور المرفوعة (Visual Gallery) */
        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            max-height: 180px;
            overflow-y: auto;
        }
        .image-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 5px;
            text-align: center;
        }
        .image-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .image-card button {
            padding: 3px 6px;
            font-size: 10px;
            width: 100%;
            margin-top: 2px;
        }

        /* جدول المقالات */
        .articles-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .articles-table th, .articles-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        .articles-table th { background-color: #0f172a; color: #38bdf8; font-size: 14px; }
        .articles-table tr:last-child td { border-bottom: none; }
        .action-btns { display: flex; gap: 6px; justify-content: flex-end; }
        .action-btns button { padding: 5px 10px; font-size: 12px; }

        /* نافذة التحميل المنبثقة (Loading Modal) */
        #loadingModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #modalText { font-size: 15px; color: #38bdf8; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <!-- نافذة التحميل المنبثقة -->
    <div id="loadingModal">
        <div class="spinner"></div>
        <div id="modalText">جاري المعالجة...</div>
    </div>

    <h1 id="formTitle">🚀 لوحة تحكم المدونة (PWA)</h1>

    <div class="form-group">
        <label>رمز الوصول الخاص (GitHub Token):</label>
        <input type="password" id="ghToken" placeholder="الصق رمز GitHub Token هنا">
    </div>

    <input type="hidden" id="editArticleId" value="">

    <div class="form-group">
        <label>عنوان المقال:</label>
        <input type="text" id="postTitle" placeholder="عنوان المقال">
    </div>

    <div class="form-group">
        <label>مقدمة قصيرة (الوصف):</label>
        <input type="text" id="postDesc" placeholder="نبذة مختصرة تظهر في الكارت الرئيسي">
    </div>

    <div class="form-group">
        <label>إدراج صور جديدة للمقال:</label>
        <input type="file" id="imageInput" accept="image/*" multiple style="padding: 8px; margin-bottom: 6px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff;">
        <button type="button" class="btn-purple" onclick="uploadImages()">رفع الصور وإضافتها للمعرض 🖼️</button>
        
        <!-- معرض معاينة الصور المرفوعة -->
        <label style="margin-top: 10px;">معرض الصور المرفوعة (اضغط إدراج لإضافتها للمقال):</label>
        <div id="imageGallery" class="image-preview-container">
            <span style="font-size: 12px; color: #64748b; grid-column: 1/-1; text-align: center; padding: 15px;">لم يتم رفع صور بعد.</span>
        </div>
    </div>

    <div class="form-group">
        <label>محتوى المقال كاملاً:</label>
        <div class="toolbar">
            <button type="button" class="tool-btn" onclick="insertTag('<b>', '</b>')"><b>B</b> عريض</button>
            <button type="button" class="tool-btn" onclick="insertTag('<i>', '</i>')"><i>I</i> مائل</button>
            <button type="button" class="tool-btn" onclick="insertTag('<u>', '</u>')"><u>U</u> خط تحته</button>
            <button type="button" class="tool-btn" onclick="insertTag('<h2>', '</h2>')">عنوان H2</button>
            <button type="button" class="tool-btn" onclick="insertTag('<h3>', '</h3>')">عنوان H3</button>
            <button type="button" class="tool-btn" onclick="insertTag('<blockquote style=\'border-right:3px solid #38bdf8; padding-right:10px; color:#cbd5e1;\'>', '</blockquote>')">اقتباس</button>
            <button type="button" class="tool-btn" onclick="insertTextAtCursor('<hr style=\'border:0; border-top:1px dashed #334155; margin:15px 0;\'>\n')">خط فاصل</button>
        </div>
        <textarea id="postBody" class="styled-textarea" onblur="savedCursorPos = this.selectionStart" placeholder="اكتب نص المقال هنا..."></textarea>
    </div>

    <button id="publishBtn" class="btn-green" onclick="saveArticle()">نشر المقال فوراً 🚀</button>
    <button id="cancelEditBtn" class="btn-red" onclick="cancelEdit()" style="display:none; width:100%; margin-top:8px;">إلغاء التعديل</button>

    <h2>📚 المقالات المنشورة حالياً</h2>
    <button class="btn-blue" onclick="loadArticlesList()">تحديث جدول المقالات 🔄</button>
    
    <div id="articlesList">اضغط على زر التحديث لعرض الجدول.</div>

    <script>
        let savedCursorPos = 0;

        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str.replace(/\s/g, '')))); }

        const repoOwner = 'mazen-alawdhali'; 
        const repoName = 'blog.solartoolspro.com'; 
        const filePath = 'articles.json';
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`;

        // إظهار وإخفاء نافذة التحميل المنبثقة
        function showModal(text) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('loadingModal').style.display = 'flex';
        }
        function hideModal() {
            document.getElementById('loadingModal').style.display = 'none';
        }

        // إدراج نص في موضع المؤشر
        function insertTextAtCursor(text) {
            const textarea = document.getElementById('postBody');
            const pos = savedCursorPos > 0 ? savedCursorPos : textarea.value.length;
            textarea.value = textarea.value.substring(0, pos) + text + textarea.value.substring(pos);
            savedCursorPos = pos + text.length;
            textarea.focus();
        }

        // تحويط النص المضلل بأوسمة
        function insertTag(openTag, closeTag) {
            const textarea = document.getElementById('postBody');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            const replacement = openTag + selectedText + closeTag;
            textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
            textarea.focus();
        }

        // إدراج صورة معينة من المعرض بنقرة واحدة
        function insertImageToBody(url) {
            const imgCode = `\n<img src="${url}" alt="صورة توضيحية" style="width:100%; border-radius:10px; margin:15px 0; display:block;">\n`;
            insertTextAtCursor(imgCode);
        }

        // جلب البيانات من GitHub
        async function fetchFileFromGithub(token) {
            const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error('تعذر الاتصال بـ GitHub');
            const data = await res.json();
            const content = b64_to_utf8(data.content);
            return { sha: data.sha, articles: JSON.parse(content) };
        }

        // عرض جدول المقالات المنشورة
        async function loadArticlesList() {
            const token = document.getElementById('ghToken').value.trim();
            const listDiv = document.getElementById('articlesList');
            if (!token) return alert('يرجى إدخال رمز الـ Token أولاً!');

            showModal('جاري جلب جدول المقالات...');
            try {
                const { articles } = await fetchFileFromGithub(token);
                hideModal();
                if (articles.length === 0) {
                    listDiv.innerText = 'لا توجد مقالات منشورة.';
                    return;
                }

                let tableHtml = `
                    <table class="articles-table">
                        <thead>
                            <tr>
                                <th>عنوان المقال</th>
                                <th style="width: 130px; text-align: center;">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                articles.forEach((art) => {
                    tableHtml += `
                        <tr>
                            <td><b>${art.title}</b></td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn-edit" onclick="prepareEdit(${art.id})">تعديل ✏️</button>
                                    <button class="btn-red" onclick="deleteArticle(${art.id})">حذف 🗑️</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                tableHtml += `</tbody></table>`;
                listDiv.innerHTML = tableHtml;
            } catch (err) {
                hideModal();
                listDiv.innerText = '❌ خطأ: ' + err.message;
            }
        }

        // رفع الصور وعرضها في المعرض المرئي
        async function uploadImages() {
            const fileInput = document.getElementById('imageInput');
            const token = document.getElementById('ghToken').value.trim();

            if (!token) return alert('يرجى إدخال رمز GitHub Token أولاً!');
            if (fileInput.files.length === 0) return alert('يرجى اختيار صور أولاً!');

            const files = Array.from(fileInput.files);
            showModal(`جاري رفع ${files.length} صورة إلى السيرفر...`);

            let uploadedUrls = [];

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    document.getElementById('modalText').innerText = `جاري رفع الصورة ${i + 1} من ${files.length}...`;
                    
                    const base64Content = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = error => reject(error);
                    });

                    const fileName = `images/${Date.now()}_${i}_${file.name.replace(/\s+/g, '_')}`;
                    const imgApiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${fileName}`;

                    const res = await fetch(imgApiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `رفع صورة: ${file.name}`,
                            content: base64Content
                        })
                    });

                    if (!res.ok) throw new Error(`فشل رفع الصورة ${file.name}`);

                    const rawImageUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${fileName}`;
                    uploadedUrls.push(rawImageUrl);
                }

                hideModal();
                alert(`✅ تم رفع ${files.length} صورة بنجاح وإضافتها لمعرض الصور أدناه!`);
                fileInput.value = '';

                // تحديث المعرض البصري بالصور الجديدة
                const gallery = document.getElementById('imageGallery');
                if (gallery.innerHTML.includes('لم يتم رفع صور بعد')) {
                    gallery.innerHTML = '';
                }

                uploadedUrls.forEach(url => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `
                        <img src="${url}" alt="معاينة">
                        <button type="button" class="btn-green" onclick="insertImageToBody('${url}')">إدراج 📥</button>
                    `;
                    gallery.appendChild(card);
                });

            } catch (err) {
                hideModal();
                alert('❌ خطأ أثناء رفع الصور: ' + err.message);
            }
        }

        // نشر أو تعديل مقال
        async function saveArticle() {
            const token = document.getElementById('ghToken').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const desc = document.getElementById('postDesc').value.trim();
            const body = document.getElementById('postBody').value.trim();
            const editId = document.getElementById('editArticleId').value;
            const btn = document.getElementById('publishBtn');

            if (!token || !title || !desc || !body) {
                alert('يرجى تعبئة كافة الحقول المطلوبة!');
                return;
            }

            localStorage.setItem('gh_token', token);
            btn.disabled = true;
            showModal('جاري تحديث ونشر المقال على GitHub...');

            try {
                const { sha, articles } = await fetchFileFromGithub(token);

                if (editId) {
                    const index = articles.findIndex(a => a.id == editId);
                    if (index !== -1) {
                        articles[index].title = title;
                        articles[index].description = desc;
                        articles[index].body = body;
                    }
                } else {
                    articles.push({ id: Date.now(), title, description: desc, body });
                }

                const updatedContent = utf8_to_b64(JSON.stringify(articles, null, 2));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: editId ? `تعديل مقال: ${title}` : `إضافة مقال جديد: ${title}`,
                        content: updatedContent,
                        sha: sha
                    })
                });

                hideModal();
                btn.disabled = false;

                if (putRes.ok) {
                    alert(editId ? '✅ تم تعديل المقال وحفظه بنجاح!' : '🚀 تم نشر المقال الجديد بنجاح!');
                    cancelEdit();
                    loadArticlesList();
                } else {
                    throw new Error('فشل حفظ التغييرات على السيرفر.');
                }
            } catch (err) {
                hideModal();
                btn.disabled = false;
                alert('❌ خطأ: ' + err.message);
            }
        }

        // تجهيز للتعديل
        async function prepareEdit(id) {
            const token = document.getElementById('ghToken').value.trim();
            showModal('جاري تحميل بيانات المقال...');
            try {
                const { articles } = await fetchFileFromGithub(token);
                hideModal();
                const art = articles.find(a => a.id == id);
                if (art) {
                    document.getElementById('editArticleId').value = art.id;
                    document.getElementById('postTitle').value = art.title;
                    document.getElementById('postDesc').value = art.description;
                    document.getElementById('postBody').value = art.body;
                    
                    document.getElementById('formTitle').innerText = '✏️ تعديل المقال';
                    document.getElementById('publishBtn').innerText = 'حفظ التعديلات 💾';
                    document.getElementById('cancelEditBtn').style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (err) {
                hideModal();
                alert(err.message);
            }
        }

        // إلغاء التعديل
        function cancelEdit() {
            document.getElementById('editArticleId').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            document.getElementById('postBody').value = '';
            document.getElementById('formTitle').innerText = '🚀 لوحة تحكم المدونة (PWA)';
            document.getElementById('publishBtn').innerText = 'نشر المقال فوراً 🚀';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        // حذف مقال
        async function deleteArticle(id) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا المقال نهائياً؟')) return;
            const token = document.getElementById('ghToken').value.trim();

            showModal('جاري حذف المقال...');

            try {
                const { sha, articles } = await fetchFileFromGithub(token);
                const filteredArticles = articles.filter(a => a.id != id);

                const updatedContent = utf8_to_b64(JSON.stringify(filteredArticles, null, 2));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `حذف مقال`,
                        content: updatedContent,
                        sha: sha
                    })
                });

                hideModal();
                if (putRes.ok) {
                    alert('🗑️ تم حذف المقال بنجاح!');
                    loadArticlesList();
                } else {
                    throw new Error('فشل الحذف.');
                }
            } catch (err) {
                hideModal();
                alert('❌ خطأ: ' + err.message);
            }
        }
    </script>
</body>
</html>
