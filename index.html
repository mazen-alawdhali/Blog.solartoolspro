<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>مدونة منصة أدوات الطاقة الشمسية الاحترافية | SolarToolsPro</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            line-height: 1.7;
            padding-bottom: 40px;
        }

        /* الهيدر البانورامي بتعتيم خفيف وواضح */
        .hero-header {
            position: relative;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(11, 19, 41, 0.75)), url('images/hero.webp') center/cover no-repeat;
            text-align: center;
            padding: 45px 20px 35px 20px;
            border-bottom: 1px solid #1e293b;
        }
        .hero-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px auto;
            display: block;
            filter: drop-shadow(0 0 8px #38bdf8);
        }
        .hero-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .hero-subtitle {
            font-size: 14px;
            color: #34d399;
            max-width: 500px;
            margin: 0 auto;
            font-weight: 600;
        }

        /* حاوية المقالات */
        .main-container {
            max-width: 680px;
            margin: 25px auto 0 auto;
            padding: 0 16px;
        }
        .section-heading {
            text-align: center;
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* كروت المقالات */
        .article-card {
            background-color: #162032;
            border: 1px solid #24334c;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .article-title {
            font-size: 19px;
            color: #34d399;
            margin-bottom: 10px;
            font-weight: 700;
            line-height: 1.4;
        }
        .article-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        /* محتوى المقال */
        .article-body {
            display: none;
            padding-top: 18px;
            margin-top: 15px;
            border-top: 1px dashed #2a3b59;
            color: #e2e8f0;
            font-size: 15px;
            line-height: 1.8;
            word-wrap: break-word;
        }
        
        .article-body img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 12px;
            margin: 15px 0;
            display: block;
            border: 1px solid #334155;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        .article-body blockquote {
            border-right: 4px solid #38bdf8;
            padding: 10px 14px;
            color: #cbd5e1;
            margin: 14px 0;
            font-style: italic;
            background: rgba(56, 189, 248, 0.06);
            border-radius: 0 8px 8px 0;
        }
        .article-body h2 { font-size: 17px; color: #38bdf8; margin: 18px 0 8px 0; }
        .article-body h3 { font-size: 15px; color: #f59e0b; margin: 14px 0 6px 0; }

        .btn-toggle {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            width: 100%;
            justify-content: center;
        }
        .btn-toggle:hover { background-color: #0369a1; }

        #statusMessage {
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
            color: #94a3b8;
        }
        
        footer {
            text-align: center;
            margin-top: 45px;
            padding: 25px 16px;
            border-top: 1px solid #1e293b;
            font-size: 13px;
            color: #94a3b8;
            background-color: #0b1329;
        }
        footer a { color: #38bdf8; text-decoration: none; margin: 0 6px; }
        .footer-links {
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .footer-credits { margin-top: 10px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header class="hero-header">
        <svg class="hero-icon" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <h1 class="hero-title">أدوات الطاقة الشمسية الاحترافية</h1>
        <p class="hero-subtitle">المنصة الهندسية الشاملة لتصميم وحساب منظومات الطاقة الشمسية والبطاريات</p>
    </header>

    <div class="main-container">
        <h2 class="section-heading">📚 المقالات والدراسات الهندسية</h2>

        <div id="articlesContainer">
            <div id="statusMessage">جاري تحميل أحدث المقالات... ⏳</div>
        </div>
    </div>

    <!-- الفوتر المكتمل -->
    <footer>
        <div class="footer-links">
            <a href="https://solartoolspro.com">الصفحة الرئيسية</a> |
            <a href="https://solartoolspro.com">سياسة الخصوصية</a> |
            <a href="https://solartoolspro.com">نبذة عنّا</a> |
            <a href="https://solartoolspro.com">اتصل بنا</a>
        </div>

        <div class="footer-credits">
            تصميم وتطوير <strong style="color: #34d399;">مازن العوذلي</strong> © 2026 جميع الحقوق محفوظة
        </div>
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        async function loadArticles() {
            const container = document.getElementById('articlesContainer');
            const cacheBuster = `?v=${new Date().getTime()}`;
            
            try {
                const res = await fetch(`articles.json${cacheBuster}`);
                if (!res.ok) throw new Error('تعذر تحميل ملف المقالات');
                
                const articles = await res.json();
                
                if (!articles || articles.length === 0) {
                    container.innerHTML = '<div id="statusMessage">لا توجد مقالات منشورة حالياً.</div>';
                    return;
                }

                container.innerHTML = '';

                articles.reverse().forEach((art) => {
                    const card = document.createElement('div');
                    card.className = 'article-card';

                    card.innerHTML = `
                        <h3 class="article-title">${art.title}</h3>
                        <p class="article-desc">${art.description}</p>
                        
                        <div class="article-body" id="body-${art.id}">
                            ${art.body}
                        </div>

                        <button class="btn-toggle" onclick="toggleArticle(${art.id}, this)">
                            قراءة المقال كاملاً 📖
                        </button>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = `<div id="statusMessage" style="color: #f87171;">❌ خطأ في تحميل المقالات: ${err.message}</div>`;
            }
        }

        function toggleArticle(id, btn) {
            const body = document.getElementById(`body-${id}`);
            if (body.style.display === 'block') {
                body.style.display = 'none';
                btn.innerHTML = 'قراءة المقال كاملاً 📖';
            } else {
                body.style.display = 'block';
                btn.innerHTML = 'إخفاء المقال ↗';
            }
        }

        loadArticles();
    </script>
</body>
</html>
