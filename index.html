<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة أدوات الطاقة الشمسية الاحترافية | SolarToolsPro</title>
    
    <!-- الوسوم المعتمدة لأيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://blog.solartoolspro.com/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://blog.solartoolspro.com/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://blog.solartoolspro.com/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- تحسينات محركات البحث ووسوم المشاركة -->
    <meta name="description" content="أحدث المقالات والأدلة التقنية لأجهزة ومنظومات الطاقة الشمسية والبطاريات والإنفرترات">
    <meta property="og:title" content="مدونة أدوات الطاقة الشمسية الاحترافية">
    <meta property="og:description" content="أحدث المقالات والأدلة التقنية لأجهزة ومنظومات الطاقة الشمسية والبطاريات">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* الهيدر والبنر الرئيسي - بدون أي ضبابية (Blur Removed) */
        header {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://blog.solartoolspro.com/images/banner.jpg') center/cover no-repeat;
            text-align: center;
            padding: 45px 20px 35px;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            border-radius: 0 0 20px 20px;
        }
        header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 800;
        }
        header p {
            font-size: 14px;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
        }

        /* أدوات البحث والتصفية */
        .controls-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 25px;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .search-input:focus { border-color: #38bdf8; }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .cat-btn {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: #0284c7;
            color: #fff;
            border-color: #0284c7;
        }

        /* شبكة المقالات (Cards) */
        .articles-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .article-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            scroll-margin-top: 30px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .article-card:target {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .article-title {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .article-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .article-body {
            display: none;
            font-size: 15px;
            line-height: 1.8;
            color: #e2e8f0;
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-bottom: 15px;
        }
        .article-body img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 10px;
            margin: 12px 0;
            border: 1px solid #334155;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-read {
            flex: 1;
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-share {
            background-color: #16a34a;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* نظام التنبيهات المنبثقة العصري (Toasts) */
        #toastContainer {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
            text-align: center;
        }
        .toast-success { background: rgba(16, 185, 129, 0.95); border: 1px solid #34d399; }
        .toast-error { background: rgba(239, 68, 68, 0.95); border: 1px solid #f87171; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

        /* الفوتر */
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            color: #64748b;
            font-size: 13px;
        }
        footer a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <header>
        <h1>مدونة أدوات الطاقة الشمسية الاحترافية</h1>
        <p>SolarToolsPro - دليلكم التقني الشامل لمنظومات الطاقة الشمسية والبطاريات والإنفرترات</p>
    </header>

    <div class="container">
        <!-- شريط البحث والتصنيفات -->
        <div class="controls-card">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث في المقالات التقنية..." oninput="filterArticles()">
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
                <button class="cat-btn" onclick="filterCategory('بطاريات', this)">البطاريات</button>
                <button class="cat-btn" onclick="filterCategory('ألواح', this)">الألواح الشمسية</button>
                <button class="cat-btn" onclick="filterCategory('إنفرترات', this)">الإنفرترات</button>
            </div>
        </div>

        <!-- خلاصة المقالات -->
        <div id="articlesFeed" class="articles-feed">
            <div style="text-align: center; color: #94a3b8; padding: 30px;">جاري تحميل المقالات... ⏳</div>
        </div>

        <footer>
            تصميم وتطوير <b>م. مازن العوذلي</b> © 2026 جميع الحقوق محفوظة | <a href="https://solartoolspro.com" target="_blank">حاسبة الطاقة الرئيسية</a>
        </footer>
    </div>

    <script>
        let allArticles = [];
        let currentCategory = 'all';

        // إشعار عصري منبثق
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // جلب المقالات المباشر مع منع التخزين المؤقت (Cache-Busting)
        async function fetchArticles() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/mazen-alawdhali/blog.solartoolspro.com/main/articles.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('فشل جلب البيانات');
                allArticles = await res.json();
                renderArticles(allArticles);
                
                // التوجيه المباشر للمقال المحدد في حالة النقر على رابط الواتساب
                if (window.location.hash) {
                    const targetId = window.location.hash.replace('#article-', '');
                    setTimeout(() => {
                        toggleArticle(targetId, true);
                        const el = document.getElementById(`article-${targetId}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                }
            } catch (err) {
                document.getElementById('articlesFeed').innerHTML = `<div style="text-align: center; color: #f87171;">❌ متعذر تحميل المقالات حالياً.</div>`;
            }
        }

        // عرض المقالات
        function renderArticles(articles) {
            const feed = document.getElementById('articlesFeed');
            if (!articles || articles.length === 0) {
                feed.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">لا توجد مقالات مطابقة للبحث.</div>`;
                return;
            }

            feed.innerHTML = articles.map(art => `
                <div class="article-card" id="article-${art.id}">
                    <div class="article-meta">
                        <span>📖 مقال تقني</span>
                        <span>⏱️ 3 دقائق قراءة</span>
                    </div>
                    <h2 class="article-title">${art.title}</h2>
                    <p class="article-desc">${art.description}</p>
                    
                    <div class="article-body" id="body-${art.id}">
                        ${art.body}
                    </div>

                    <div class="card-actions">
                        <button class="btn-read" id="btn-read-${art.id}" onclick="toggleArticle(${art.id})">قراءة المقال كاملاً 📖</button>
                        <button class="btn-share" onclick="shareToWhatsApp(${art.id}, '${escapeQuotes(art.title)}')">واتساب 📲</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // إظهار/إخفاء المقال
        function toggleArticle(id, forceOpen = false) {
            const bodyEl = document.getElementById(`body-${id}`);
            const btnEl = document.getElementById(`btn-read-${id}`);
            
            if (!bodyEl) return;

            const isOpen = bodyEl.style.display === 'block';
            if (!isOpen || forceOpen) {
                bodyEl.style.display = 'block';
                if (btnEl) btnEl.innerText = 'إغلاق المقال ✖';
            } else {
                bodyEl.style.display = 'none';
                if (btnEl) btnEl.innerText = 'قراءة المقال كاملاً 📖';
            }
        }

        // 📲 مشاركة المقال المحدّد بالضبط عبر واتساب
        function shareToWhatsApp(id, title) {
            const targetArticleUrl = `https://blog.solartoolspro.com/#article-${id}`;
            const message = `📌 *${title}*\n\nاقرأ المقال التقني كاملاً عبر الرابط التالي:\n${targetArticleUrl}`;
            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            
            window.open(waUrl, '_blank');
            showToast('جاري فتح واتساب للمشاركة... 📲', 'success');
        }

        // تصفية وحث المقالات
        function filterArticles() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allArticles.filter(art => {
                const matchesQuery = art.title.toLowerCase().includes(query) || art.description.toLowerCase().includes(query);
                const matchesCat = currentCategory === 'all' || art.title.includes(currentCategory) || art.description.includes(currentCategory);
                return matchesQuery && matchesCat;
            });
            renderArticles(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            filterArticles();
        }

        // تسجيل الـ Service Worker للمدونة PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', fetchArticles);
    </script>
</body>
</html>
