<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مدونة الطاقة الشمسية">
    
    <!-- ربط ملف الـ Manifest الرسمي للتثبيت كـ PWA -->
    <link rel="manifest" href="manifest.json">
    
    <title>مدونة SolarToolsPro | أدلة ومقالات الطاقة الشمسية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding: 16px;
            max-width: 700px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 6px; }
        p.subtitle { font-size: 13px; color: #94a3b8; }

        /* شريط البحث والتصنيفات */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        .search-box:focus { border-color: #38bdf8; }

        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: #0284c7;
            color: #fff;
            border-color: #0284c7;
        }

        /* بطاقات المقالات */
        .article-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .article-card:active { transform: scale(0.99); }
        .article-card h2 { font-size: 18px; color: #f8fafc; margin-bottom: 8px; line-height: 1.4; }
        .article-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .article-card p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 15px; }
        
        .read-more-btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* نافذة قراءة المقال الكاملة (Modal) */
        #articleModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(8px);
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 12px;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .modal-title { font-size: 20px; color: #38bdf8; line-height: 1.4; }
        .modal-body { font-size: 15px; line-height: 1.8; color: #e2e8f0; margin-bottom: 20px; }
        .modal-body img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 10px;
            margin: 12px 0;
            display: block;
            border: 1px solid #334155;
        }
        .modal-body blockquote {
            border-right: 3px solid #38bdf8;
            padding-right: 12px;
            color: #cbd5e1;
            margin: 12px 0;
            font-style: italic;
        }

        /* أزرار المشاركة السريعة داخل المقال */
        .share-section {
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .share-section p { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
        .share-btns { display: flex; gap: 10px; justify-content: center; }
        .share-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-whatsapp { background-color: #22c55e; }
        .btn-telegram { background-color: #0ea5e9; }
        .btn-copy { background-color: #475569; }

        .loading, .error-msg { text-align: center; padding: 30px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ مدونة SolarToolsPro</h1>
        <p class="subtitle">أحدث المقالات والأدلة التقنية لأنظمة الطاقة الشمسية والبطاريات</p>
    </header>

    <!-- شريط البحث السريع -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث في المقالات التقنية..." oninput="filterArticles()">

    <!-- شريط التصنيفات والفلترة -->
    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterByCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterByCategory('بطاريات', this)">البطاريات</button>
        <button class="cat-btn" onclick="filterByCategory('ألواح', this)">الألواح الشمسية</button>
        <button class="cat-btn" onclick="filterByCategory('إنفرترات', this)">الإنفرترات</button>
        <button class="cat-btn" onclick="filterByCategory('حماية', this)">الحماية والأحمال</button>
    </div>

    <div id="articlesContainer">
        <div class="loading">جاري تحميل المقالات... ⏳</div>
    </div>

    <!-- نافذة عرض المقال الكاملة (Modal) -->
    <div id="articleModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">عنوان المقال</h2>
                <button class="cat-btn" onclick="closeArticleModal()" style="padding: 6px 12px;">إغلاق ✖</button>
            </div>
            <div class="modal-body" id="modalBody">محتوى المقال...</div>
            
            <!-- قسم المشاركة السريعة -->
            <div class="share-section">
                <p>مشاركة المقال مع الأصدقاء والتقنيين:</p>
                <div class="share-btns">
                    <button class="share-btn btn-whatsapp" onclick="shareToWhatsApp()">واتساب 💚</button>
                    <button class="share-btn btn-telegram" onclick="shareToTelegram()">تلجرام 💙</button>
                    <button class="share-btn btn-copy" onclick="copyArticleLink()">نسخ الرابط 🔗</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allArticles = [];
        let currentSelectedArticle = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        async function fetchArticles() {
            try {
                const res = await fetch('articles.json');
                if (!res.ok) throw new Error('تعذر تحميل المقالات');
                allArticles = await res.json();
                displayArticles(allArticles);
            } catch (err) {
                document.getElementById('articlesContainer').innerHTML = `<div class="error-msg">❌ لا توجد مقالات منشورة حالياً أو تعذر الاتصال بالسيرفر.</div>`;
            }
        }

        function calculateReadingTime(text) {
            const words = text.replace(/<[^>]*>/g, '').split(/\s+/).length;
            const minutes = Math.ceil(words / 150); // المعدل التقريبي للقراءة 150 كلمة في الدقيقة
            return minutes < 1 ? 1 : minutes;
        }

        function displayArticles(articles) {
            const container = document.getElementById('articlesContainer');
            if (articles.length === 0) {
                container.innerHTML = `<div class="error-msg">📭 لا توجد مقالات مطابقة لبحثك.</div>`;
                return;
            }

            let html = '';
            articles.forEach(art => {
                const readTime = calculateReadingTime(art.body || '');
                html += `
                    <div class="article-card" onclick="openArticleModal(${art.id})">
                        <div class="article-meta">
                            <span>⏱️ ${readTime} دقائق قراءة</span>
                        </div>
                        <h2>${art.title}</h2>
                        <p>${art.description}</p>
                        <button class="read-more-btn">قراءة المقال كاملاً 📖</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterArticles() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allArticles.filter(art => 
                art.title.toLowerCase().includes(query) || 
                art.description.toLowerCase().includes(query) ||
                art.body.toLowerCase().includes(query)
            );
            displayArticles(filtered);
        }

        function filterByCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'all') {
                displayArticles(allArticles);
            } else {
                const filtered = allArticles.filter(art => 
                    art.title.toLowerCase().includes(category) || 
                    art.description.toLowerCase().includes(category) ||
                    art.body.toLowerCase().includes(category)
                );
                displayArticles(filtered);
            }
        }

        function openArticleModal(id) {
            const art = allArticles.find(a => a.id == id);
            if (!art) return;
            currentSelectedArticle = art;

            document.getElementById('modalTitle').innerText = art.title;
            document.getElementById('modalBody').innerHTML = art.body;
            document.getElementById('articleModal').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeArticleModal() {
            document.getElementById('articleModal').style.display = 'none';
            currentSelectedArticle = null;
        }

        function shareToWhatsApp() {
            if (!currentSelectedArticle) return;
            const url = window.location.href.split('#')[0] + '#' + currentSelectedArticle.id;
            const text = `📌 ${currentSelectedArticle.title}\n\n${currentSelectedArticle.description}\n\nاقرأ المقال كاملاً عبر الرابط:\n${url}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        function shareToTelegram() {
            if (!currentSelectedArticle) return;
            const url = window.location.href.split('#')[0] + '#' + currentSelectedArticle.id;
            const text = `📌 ${currentSelectedArticle.title}\n\n${currentSelectedArticle.description}`;
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
        }

        function copyArticleLink() {
            if (!currentSelectedArticle) return;
            const url = window.location.href.split('#')[0];
            navigator.clipboard.writeText(url).then(() => {
                alert('📋 تم نسخ رابط المقال بنجاح!');
            });
        }

        // جلب المقالات عند تحميل الصفحة
        fetchArticles();
    </script>
</body>
</html>
